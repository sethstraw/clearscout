[alembic]
script_location = src/tailorcv/infrastructure/persistence/migrations
prepend_sys_path = src

# Runtime commands supply this value programmatically. This harmless local
# default makes contributor autogeneration explicit and keeps personal data out
# of the repository.
sqlalchemy.url = sqlite+pysqlite:///tailorcv-development.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
