<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1030"><title id="title">Bring boards into the search</title><desc id="desc">Manual validation and paid guided search both lead to source review, enabling Swept, free scans and the pending queue. Guided sources begin disabled.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="1200" height="1030" fill="#f3f5fa"/><g font-family="Arial, sans-serif"><text x="54" y="65" font-size="19" fill="#6050bf" font-weight="700">ClearScout</text><text x="54" y="126" font-size="44" fill="#111b2a" font-weight="700">Bring boards into the search</text><text x="54" y="171" font-size="25" fill="#344256" font-weight="400">Manual setup is free. Guided discovery is a paid provider task.</text><text x="54" y="224" font-size="29" fill="#0e766c" font-weight="700">Add a board manually</text><rect x="54" y="248" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="248" width="8" height="144" rx="4" fill="#0e766c"/><text x="82" y="287" font-size="28" fill="#111b2a" font-weight="700">1. Settings &gt; Search &gt; Sources</text><text x="82" y="326" font-size="24" fill="#344256" font-weight="400">Paste the board or careers address.</text><text x="82" y="356" font-size="24" fill="#344256" font-weight="400">Choose employer board or aggregator.</text><path d="M311 396 L311 421" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="423" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="423" width="8" height="144" rx="4" fill="#0e766c"/><text x="82" y="462" font-size="28" fill="#111b2a" font-weight="700">2. Validate, then name it</text><text x="82" y="501" font-size="24" fill="#344256" font-weight="400">Read the validation result. Add a name</text><text x="82" y="531" font-size="24" fill="#344256" font-weight="400">and any published reading condition.</text><path d="M311 571 L311 596" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="598" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="598" width="8" height="144" rx="4" fill="#0e766c"/><text x="82" y="637" font-size="28" fill="#111b2a" font-weight="700">3. Add source</text><text x="82" y="676" font-size="24" fill="#344256" font-weight="400">Check Swept and confirm any condition.</text><text x="82" y="706" font-size="24" fill="#344256" font-weight="400">Setup makes no model call.</text><text x="632" y="224" font-size="29" fill="#6050bf" font-weight="700">Find boards through guided search</text><rect x="632" y="248" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="248" width="8" height="144" rx="4" fill="#6050bf"/><text x="660" y="287" font-size="28" fill="#111b2a" font-weight="700">1. Find jobs &gt; Find new jobs</text><text x="660" y="326" font-size="24" fill="#344256" font-weight="400">Inspect the preview and confirm cost.</text><text x="660" y="356" font-size="24" fill="#344256" font-weight="400">Guided campaigns require OpenAI.</text><path d="M889 396 L889 421" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="423" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="423" width="8" height="144" rx="4" fill="#6050bf"/><text x="660" y="462" font-size="28" fill="#111b2a" font-weight="700">2. Follow the task report</text><text x="660" y="501" font-size="24" fill="#344256" font-weight="400">Hosted search proposes addresses.</text><text x="660" y="531" font-size="24" fill="#344256" font-weight="400">Local policy decides which can be read.</text><path d="M889 571 L889 596" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="598" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="598" width="8" height="144" rx="4" fill="#6050bf"/><text x="660" y="637" font-size="28" fill="#111b2a" font-weight="700">3. Review new sources</text><text x="660" y="676" font-size="24" fill="#344256" font-weight="400">Discovered boards begin disabled.</text><text x="660" y="706" font-size="24" fill="#344256" font-weight="400">Review terms, then switch on Swept.</text><rect x="54" y="804" width="1092" height="128" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="804" width="8" height="128" rx="4" fill="#0e766c"/><text x="82" y="843" font-size="28" fill="#111b2a" font-weight="700">Scan for openings, then Review found jobs</text><text x="82" y="882" font-size="24" fill="#344256" font-weight="400">Later scans read enabled sources without model calls. A lead is not an evaluation.</text><text x="54" y="987" font-size="24" fill="#344256" font-weight="400">Registration, policy permission, and scan results are separate facts.</text></g></svg>