<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1280 640">
  <title>ClearScout - find the roles your record already fits</title>
  <rect width="1280" height="640" fill="#0b0e14" />
  <circle cx="1138" cy="74" r="270" fill="#7462ff" opacity="0.12" />
  <circle cx="1190" cy="600" r="320" fill="#0e9888" opacity="0.1" />

  <g transform="translate(82 72) scale(1.25)">
    <rect width="64" height="64" rx="14" fill="#0e1720" />
    <rect x="16" y="37.5" width="32" height="12" rx="6" fill="#0e9888" />
    <rect x="20.5" y="26" width="23" height="10" rx="5" fill="#f8fafc" transform="rotate(-5 32 31)" />
    <rect x="25" y="15" width="14" height="9.5" rx="4.75" fill="#7462ff" transform="rotate(4 32 19.75)" />
  </g>

  <text x="190" y="125" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="800">ClearScout</text>
  <text x="82" y="246" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800">Find the roles your record</text>
  <text x="82" y="322" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800">already fits.</text>
  <text x="84" y="392" fill="#aab3c2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500">One master CV. Evidence-backed drafts. Human approval.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">
    <rect x="82" y="474" width="132" height="48" rx="24" fill="#17212d" stroke="#0e9888" />
    <text x="111" y="505" fill="#75d5c5">LOCAL</text>
    <rect x="232" y="474" width="282" height="48" rx="24" fill="#19172c" stroke="#7462ff" />
    <text x="260" y="505" fill="#b5aaff">EVIDENCE-GROUNDED</text>
    <rect x="532" y="474" width="196" height="48" rx="24" fill="#17212d" stroke="#60758a" />
    <text x="562" y="505" fill="#c4ccd6">OPEN SOURCE</text>
  </g>

  <path d="M84 574H1196" stroke="#27313e" stroke-width="2" />
  <circle cx="84" cy="574" r="7" fill="#0e9888" />
  <circle cx="640" cy="574" r="7" fill="#7462ff" />
  <circle cx="1196" cy="574" r="7" fill="#f8fafc" />
