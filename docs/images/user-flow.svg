<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1030"><title id="title">Follow one application</title><desc id="desc">One career record connects discovery, evidence, drafts, and history.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="1200" height="1030" fill="#f3f5fa"/><g font-family="Arial, sans-serif"><text x="54" y="65" font-size="19" fill="#6050bf" font-weight="700">ClearScout</text><text x="54" y="126" font-size="44" fill="#111b2a" font-weight="700">Follow one application</text><text x="54" y="171" font-size="25" fill="#344256" font-weight="400">One career record connects discovery, evidence, drafts, and history.</text><rect x="54" y="240" width="514" height="174" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="240" width="8" height="174" rx="4" fill="#0e766c"/><text x="82" y="279" font-size="28" fill="#111b2a" font-weight="700">1. Build the career record</text><text x="82" y="318" font-size="24" fill="#344256" font-weight="400">Import or adopt a master CV.</text><text x="82" y="348" font-size="24" fill="#344256" font-weight="400">Check its entries and import report.</text><path d="M570 327 L623 327" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="240" width="514" height="174" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="240" width="8" height="174" rx="4" fill="#0e766c"/><text x="660" y="279" font-size="28" fill="#111b2a" font-weight="700">2. Find a lead</text><text x="660" y="318" font-size="24" fill="#344256" font-weight="400">Add a posting, scan boards,</text><text x="660" y="348" font-size="24" fill="#344256" font-weight="400">or approve a guided campaign.</text><path d="M1146 416 V448 H311 V474" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="478" width="514" height="174" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="478" width="8" height="174" rx="4" fill="#6050bf"/><text x="82" y="517" font-size="28" fill="#111b2a" font-weight="700">3. Evaluate one posting</text><text x="82" y="556" font-size="24" fill="#344256" font-weight="400">Compare requirements with CV evidence.</text><text x="82" y="586" font-size="24" fill="#344256" font-weight="400">Keep unanswered questions visible.</text><path d="M570 565 L623 565" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="478" width="514" height="174" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="478" width="8" height="174" rx="4" fill="#6050bf"/><text x="660" y="517" font-size="28" fill="#111b2a" font-weight="700">4. Draft from selected evidence</text><text x="660" y="556" font-size="24" fill="#344256" font-weight="400">Fixed facts come from the CV.</text><text x="660" y="586" font-size="24" fill="#344256" font-weight="400">The model proposes wording.</text><path d="M1146 654 V686 H311 V712" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="716" width="514" height="174" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="716" width="8" height="174" rx="4" fill="#0e766c"/><text x="82" y="755" font-size="28" fill="#111b2a" font-weight="700">5. Review and approve</text><text x="82" y="794" font-size="24" fill="#344256" font-weight="400">Read meaning against the source.</text><text x="82" y="824" font-size="24" fill="#344256" font-weight="400">Approval names the exact bytes.</text><path d="M570 803 L623 803" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="716" width="514" height="174" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="716" width="8" height="174" rx="4" fill="#0e766c"/><text x="660" y="755" font-size="28" fill="#111b2a" font-weight="700">6. Keep what happened next</text><text x="660" y="794" font-size="24" fill="#344256" font-weight="400">Record the application yourself.</text><text x="660" y="824" font-size="24" fill="#344256" font-weight="400">Corrections append to history.</text><text x="54" y="987" font-size="24" fill="#344256" font-weight="400">Provider work may cost money. Citation checks still need human source review.</text></g></svg>