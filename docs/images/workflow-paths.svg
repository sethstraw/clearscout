<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1030"><title id="title">Choose where provider work begins</title><desc id="desc">Two routes: canonical CV, board scans and local records cost no provider usage; intake, hosted search, evaluation and drafting are paid. Both return to human review.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="1200" height="1030" fill="#f3f5fa"/><g font-family="Arial, sans-serif"><text x="54" y="65" font-size="19" fill="#6050bf" font-weight="700">ClearScout</text><text x="54" y="126" font-size="44" fill="#111b2a" font-weight="700">Choose where provider work begins</text><text x="54" y="171" font-size="25" fill="#344256" font-weight="400">The app has free actions and paid tasks, not subscription tiers.</text><text x="54" y="224" font-size="30" fill="#0e766c" font-weight="700">No provider charge</text><rect x="54" y="248" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="248" width="8" height="144" rx="4" fill="#0e766c"/><text x="82" y="287" font-size="28" fill="#111b2a" font-weight="700">Start with existing evidence</text><text x="82" y="326" font-size="24" fill="#344256" font-weight="400">Create a workspace without a CV,</text><text x="82" y="356" font-size="24" fill="#344256" font-weight="400">or explore the synthetic demo.</text><path d="M311 394 L311 417" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="420" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="420" width="8" height="144" rx="4" fill="#0e766c"/><text x="82" y="459" font-size="28" fill="#111b2a" font-weight="700">Find and inspect listings</text><text x="82" y="498" font-size="24" fill="#344256" font-weight="400">Register boards, scan enabled sources,</text><text x="82" y="528" font-size="24" fill="#344256" font-weight="400">or add a posting address.</text><path d="M311 566 L311 589" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="592" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="592" width="8" height="144" rx="4" fill="#0e766c"/><text x="82" y="631" font-size="28" fill="#111b2a" font-weight="700">Keep the local record</text><text x="82" y="670" font-size="24" fill="#344256" font-weight="400">Read stored reports and documents.</text><text x="82" y="700" font-size="24" fill="#344256" font-weight="400">Record events on already tracked jobs.</text><path d="M311 738 L311 761" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="764" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="54" y="764" width="8" height="144" rx="4" fill="#0e766c"/><text x="82" y="803" font-size="28" fill="#111b2a" font-weight="700">Review an existing document</text><text x="82" y="842" font-size="24" fill="#344256" font-weight="400">Read its evidence and record decisions.</text><text x="82" y="872" font-size="24" fill="#344256" font-weight="400">Download the stored draft.</text><text x="632" y="224" font-size="30" fill="#6050bf" font-weight="700">Paid provider work</text><rect x="632" y="248" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="248" width="8" height="144" rx="4" fill="#6050bf"/><text x="660" y="287" font-size="28" fill="#111b2a" font-weight="700">Prepare or expand the search</text><text x="660" y="326" font-size="24" fill="#344256" font-weight="400">Restructure an ordinary CV; suggest terms;</text><text x="660" y="356" font-size="24" fill="#344256" font-weight="400">or run an OpenAI guided campaign.</text><path d="M889 394 L889 417" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="420" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="420" width="8" height="144" rx="4" fill="#6050bf"/><text x="660" y="459" font-size="28" fill="#111b2a" font-weight="700">Assess a selected posting</text><text x="660" y="498" font-size="24" fill="#344256" font-weight="400">Review relevance or run full evaluation.</text><text x="660" y="528" font-size="24" fill="#344256" font-weight="400">Read its citations and remaining gaps.</text><path d="M889 566 L889 589" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="592" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="592" width="8" height="144" rx="4" fill="#6050bf"/><text x="660" y="631" font-size="28" fill="#111b2a" font-weight="700">Ask for a tailored draft</text><text x="660" y="670" font-size="24" fill="#344256" font-weight="400">Select CV evidence, draft, and check.</text><text x="660" y="700" font-size="24" fill="#344256" font-weight="400">A rewrite or retry can cost more.</text><path d="M889 738 L889 761" stroke="#52657b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="632" y="764" width="514" height="144" rx="18" fill="white" stroke="#ccd4df"/><rect x="632" y="764" width="8" height="144" rx="4" fill="#6050bf"/><text x="660" y="803" font-size="28" fill="#111b2a" font-weight="700">Return to human review</text><text x="660" y="842" font-size="24" fill="#344256" font-weight="400">Check meaning against the source.</text><text x="660" y="872" font-size="24" fill="#344256" font-weight="400">No automatic application submission.</text><text x="54" y="970" font-size="24" fill="#344256" font-weight="400">Track a found job for free. Evaluation is optional and paid.</text><text x="54" y="1004" font-size="24" fill="#344256" font-weight="400">Free means no provider charge. Board reads still use the network.</text></g></svg>