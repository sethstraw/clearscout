version: 2
# A limit of 0 pauses version-update pull requests; security updates still open.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 0
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # openapi-typescript and typescript-eslint peer ranges stop below TypeScript 6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # These releases fail to load under vitest; a later one is retried.
      - dependency-name: "@uiw/react-md-editor"
        versions: ["4.2.2", "4.2.3"]
