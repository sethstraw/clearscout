version: 2
# A limit of 0 pauses version-update pull requests; security updates still open.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 0
    groups:
      web-dependencies:
        patterns: ["*"]
