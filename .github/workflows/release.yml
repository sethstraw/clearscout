name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_MALWARE_CHECK: "1"

jobs:
  release:
    name: Build and attach release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - run: uv sync --locked --all-groups
      - run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - run: bash scripts/gate.sh all
      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"
      - name: Write distribution checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Attach distributions to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --draft --prerelease --verify-tag --generate-notes
          --title "TailorCV $GITHUB_REF_NAME alpha"
