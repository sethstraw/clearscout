name = "posting_recovery_first_party_beats_aggregator"
proves = """
Ambiguity is judged only among candidates the application would read. An
aggregator reposting marked as an exact identity sits beside the employer's own
posting page, also exact. `recovery_decision` leaves the aggregator out, because
its authority is never read for a body, and records the first-party page as
"candidate_ready" rather than calling the pair ambiguous. It says nothing about
whether a live model would list the aggregator at all.
"""
mode = "screen"

posting = """
Platform Engineer, Contoso Rail Freight

Contoso Rail Freight runs its scheduling estate on an event stream. The
platform group owns the ingestion tier and the schema contract between the
yard systems and the reporting warehouse, keeping a breaking change from
reaching a consumer without any warning at all.

Requirements:
- Kafka in production

Remote within the United States. We review applications weekly.
"""

[evidence]
kafka = "Rebuilt the ingestion tier on Kafka"

[responses.jobspec]
title = "Platform Engineer"
company = "Contoso Rail Freight"
seniority = "not stated"
location = "Remote, United States"
keywords = ["Kafka"]

[[responses.jobspec.requirements]]
text = "Kafka in production"
importance = "must_have"

[[responses.match]]
requirement = "Kafka in production"
classification = "DIRECT"
strength = "strong"
evidence = ["kafka"]
note = "Rebuilt the ingestion tier on Kafka."

[posting_recovery]
employer = "Contoso Rail Freight"
title = "Platform Engineer"
known_url = "https://boards.example.test/postings/original-platform-engineer"
candidate_urls = [
    "https://listings.example.test/view/platform-engineer-contoso-rail-freight",
    "https://contoso-rail-freight.example.test/careers/platform-engineer",
]

[posting_recovery.search]
queries = ["Contoso Rail Freight platform engineer posting"]

[[posting_recovery.search.sources]]
url = "https://listings.example.test/view/platform-engineer-contoso-rail-freight"
title = "Platform Engineer at Contoso Rail Freight"

[[posting_recovery.search.sources]]
url = "https://contoso-rail-freight.example.test/careers/platform-engineer"
title = "Platform Engineer - Contoso Rail Freight"

[[posting_recovery.observations]]
url = "https://listings.example.test/view/platform-engineer-contoso-rail-freight"
authority = "aggregator"
completeness = "partial"
identity = "exact"
posting_status = "unknown"
note = "A reposting that names the same employer and title."

[[posting_recovery.observations]]
url = "https://contoso-rail-freight.example.test/careers/platform-engineer"
authority = "publisher_body"
completeness = "complete"
identity = "exact"
posting_status = "active"
note = "Employer and title match the known posting exactly."

[expect]
posting_recovery = "candidate_ready"
