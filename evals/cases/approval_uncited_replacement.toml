name = "approval_uncited_replacement"
proves = """
A reviewer rejects a drafted bullet and writes their own replacement, citing
nothing at all. Replacement text is not privileged: it goes through the same
provenance check the model's text does, so the approval is refused and the
document is never written.

What this proves is that the review workflow is not a way around the evidence
contract. It proves nothing about how likely a person is to try, which is the
question a real reviewer answers and this cannot.
"""
mode = "draft"

posting = """
Staff Platform Engineer, Litware Freight Systems

Litware Freight Systems moves regulated shipment data for carriers across North
America. We are hiring a staff engineer to own the streaming ingestion tier and
the governance tooling around it.

What you will do:
- Run and evolve a Kafka-based ingestion tier serving dozens of source systems
- Design schema registry compatibility rules so producers cannot break consumers
- Provision every environment with Terraform, from an empty account upward
- Extend the column-level data lineage service the analytics teams depend on
- Define data quality rules and route failures to the teams that own the data

What we require:
- Deep production experience with Kafka
- Terraform for infrastructure provisioning
- PostgreSQL data modeling at scale
- Demonstrated schema governance work

Preferred: data lineage tooling, data quality rules, prior work in a regulated
industry.

Remote within the United States. We are not able to sponsor employment visas
for this role.
"""

