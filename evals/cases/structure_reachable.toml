name = "structure_reachable"
proves = """
Moves `structure` off the unevaluated list: a scripted extraction reaches
`structure.structure` and runs through the shipped importer's `assemble` and
`verify` against a synthetic uploaded CV, offline.

The provider is scripted, so this proves the wiring and that the shipped
authenticity, alignment, and losslessness checks run against a scripted
extraction. It says nothing about a live model's extraction quality.
"""
mode = "screen"

posting = """
Platform Engineer, Contoso Rail Freight

Contoso Rail Freight runs its scheduling estate on an event stream. The
platform group owns the ingestion tier and the schema contract between the
yard systems and the reporting warehouse, keeping a breaking change from
reaching a consumer without any warning at all.

Requirements:
- Kafka in production

Remote within the United States. We review applications weekly.
"""

[evidence]
kafka = "Rebuilt the ingestion tier on Kafka"

