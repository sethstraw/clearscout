A record far longer than two pages, drafted in full, is fitted to the page by
dropping its weakest bullets, and the fit never drops the last printed answer
to a must-have. The audit must-have is answered only by two weak bullets that
the fit reaches; one of them has to survive, so must-have coverage passes on
the document as it prints.
"""
