name = "uncited_line"
proves = """
The simplest fabrication route and the one the whole design closes: a line with
no provenance at all. The schema permits an empty citation list, because a
required non-empty array is not expressible in strict structured output, so the
drafter can return a bullet that cites nothing and this one does.

``verify.checks.provenance`` fails the run, names how many lines and quotes the first,
and marks the finding as one a rewrite could clear, which is what feeds it back
to the drafter in a real run. The critic is never asked. The package is written
with the failure visible rather than withheld, because a person who paid for a
run should get something to read.
"""
mode = "draft"

posting = """
Data Platform Engineer, Wingtip Toys Distribution

Wingtip Toys Distribution is hiring a data platform engineer for the ingestion
and provisioning tier.

Requirements:
- Kafka in production
- Terraform for provisioning
- Data quality tooling

The tier feeds order, inventory, and returns data into a shared warehouse, and
the team is five engineers split across ingestion and provisioning. You would
own one of those halves and be expected to understand the other.

Remote within the United States.
"""

