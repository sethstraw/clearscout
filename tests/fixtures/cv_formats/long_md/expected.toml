summary = [
    "Research software leader who builds the data platforms that clinical and laboratory teams depend on, with fifteen years spent between instrument acquisition, regulated data capture, and the analytics that read from both, and a consistent record of shipping systems that outlive the grants and programmes that first funded them.",
    "Works in the seam between scientific method and production engineering, turning protocol requirements into schemas, validation rules, and release processes that survive an audit without slowing down the people actually running the studies, and that a new team can still operate two years after handover.",
    "Has led distributed groups of up to twenty-six engineers, analysts, and data managers across four sites, and has taken four platforms from a single-site pilot through multi-site rollout, regulatory review, and long-term custodianship by a team other than the one that built it.",
]
skills = [
    "**Languages:** Python, SQL, TypeScript, R, Rust, and Bash, plus a working reading knowledge of the Fortran that still sits underneath a good deal of instrument firmware and numerical analysis code.",
    "**Data platforms:** PostgreSQL, ClickHouse, DuckDB, Apache Arrow, Parquet, dbt, Airflow, and Dagster, with particular depth in schema migration against tables that cannot be taken offline.",
    "**Instrument integration:** vendor acquisition APIs, serial and socket capture, HL7 and DICOM transport, file watchers with exactly-once semantics, and reconciliation against the instrument's own audit log.",
    "**Regulated data practice:** electronic records and signatures, audit trails, computerised system validation, installation and operational qualification, and the evidence packages that accompany each of them.",
    "**Statistics and analysis:** survival analysis, mixed-effects modelling, multiple imputation for missing laboratory values, and the reproducible reporting pipelines that render them for a study report.",
    "**Distributed systems:** idempotent message consumers, outbox and change-data-capture patterns, backpressure design, and the operational runbooks that make an on-call rotation survivable for a small team.",
    "**Storage and retention:** object storage lifecycle policy, immutable archives, cryptographic manifests, restore rehearsal, and retention schedules written against the actual regulatory obligation rather than a guess.",
    "**Security practice:** threat modelling for scientific systems, least-privilege service accounts, secret rotation, de-identification and re-identification risk assessment, and access review that a data protection officer will accept.",
    "**Interfaces:** React and TypeScript for review and adjudication screens, accessible data tables for very large result sets, and the keyboard-first workflows that laboratory staff genuinely prefer.",
    "**Testing:** property-based testing of parsers, golden-file corpora for instrument output, contract tests across service boundaries, and deterministic fixtures for time-dependent and timezone-sensitive behaviour.",
    "**Infrastructure:** Terraform, Kubernetes, and a strong preference for boring deployments, blue-green cutovers, and rollback paths that have actually been exercised rather than merely documented somewhere.",
    "**Data governance:** controlled vocabularies, terminology mapping to standard code systems, master data management for sites and investigators, and provenance that survives a transformation chain six steps deep.",
    "**Collaboration:** protocol review with clinical investigators, specification workshops with data managers, vendor technical negotiation, and written design documents that a reviewer can disagree with precisely.",
    "**Teaching:** graduate teaching in scientific computing, an internal engineering curriculum for scientists who write code, and code review practice aimed at raising a team rather than gating its output.",
]
