        "description": "At Aster Systems we believe a freight schedule should be readable by the people who work it. Our platform carries the timetable that eleven regional depots plan their day from, and the integration team keeps the feeds behind it honest.\n\nThe integration team owns the whole life of a feed, from taking a new carrier on through to the nightly checks that keep its data trustworthy once it is live.\n\nWHAT YOU WILL DO AT ASTER SYSTEMS\nAs a Principal Engineer, Data Integration, you will own the end to end path a carrier feed takes from first sample file to published timetable, and you will decide when a feed is good enough to publish.\nYou will:\n- Lead the assessment of a new carrier feed from scratch, judging its schema, its coverage and how fresh it stays\n- Own the field mapping from the carrier's own format through to the published timetable, and write the dictionary that explains it\n- Work with the platform team to set the ingestion rules, the matching rules and the checks each feed has to pass\n- Take requirements from the depot teams and turn them into an integration specification they can recognise\n- Define what acceptance means for a feed, including fill rates per field and counts compared against the carrier's own totals\n- Hand a live feed over with its mapping written down; you own the onboarding, not the running of it\n\nABOUT YOU\nYou are a senior engineer who has personally carried a data integration from a first sample file through to something a business depends on, and you would rather write the dictionary than explain it twice.\n\nREQUIREMENTS\n- 8 to 12 years in data focused roles at logistics, transport or scheduling data companies\n- Demonstrated end to end ownership of integrations built from scratch, covering scoping, mapping and acceptance\n- Transport or logistics domain context required, with the ability to ramp on an unfamiliar feed quickly\n- Analytical fluency to judge data quality, and hands on experience with SQL and one scripting language\n- Familiarity with layered warehouse architectures and how a raw file becomes a published table\n\nCOMPENSATION\nThis role is paid at band four, reviewed yearly, in addition to equity.\n\nAnticipated role close date: 11/14/2026\n\nASTER SYSTEMS OFFERS\n- Full suite of health insurance options, in addition to generous paid time off\n- Pre-planned company-wide wellness holidays\n- Retirement options\n- Flexible work hours and the opportunity to work from anywhere\n\nAster Systems is proud to be an equal opportunity employer that celebrates difference, and is committed to creating a working environment in which every employee feels respected and able to do their best work."
